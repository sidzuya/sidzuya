name: Contribution snake

# Renders the contribution graph into this repo's `output` branch so the README
# can load it from raw.githubusercontent.com instead of a shared, rate-limited service.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-snake.svg?palette=github-light&color_snake=#B86E0A&color_dots=#EBEDF0,#FBE3B4,#F5C46B,#E8A32B,#B86E0A
            dist/contribution-snake-dark.svg?palette=github-dark&color_snake=#F5A524&color_dots=#161B22,#4A3210,#8A5A12,#C98418,#F5A524

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
